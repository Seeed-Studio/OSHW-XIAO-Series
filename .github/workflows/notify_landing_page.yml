name: Notify XIAO landing page

on:
  push:
    branches: [main]
    paths:
      - projects.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger landing page build
        env:
          BUILD_HOOK_URL: ${{ secrets.LANDING_PAGE_BUILD_HOOK_URL }}
        run: |
          if [ -z "$BUILD_HOOK_URL" ]; then
            echo "::warning title=Landing page not notified::Set the LANDING_PAGE_BUILD_HOOK_URL secret to the Jenkins build trigger URL of the landing page job."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 30 \
            --request POST "$BUILD_HOOK_URL"
          echo "Landing page build requested."
