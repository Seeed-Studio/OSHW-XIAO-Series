name: Notify XIAO landing page

on:
  push:
    branches: [main]
    paths:
      - projects.yaml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch project update
        env:
          GH_TOKEN: ${{ secrets.LANDING_PAGE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "LANDING_PAGE_DISPATCH_TOKEN is not configured; the scheduled landing-page sync remains available."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/Seeed-Projects/XIAO_Landing_Page/dispatches \
            --data '{"event_type":"projects-updated"}'
