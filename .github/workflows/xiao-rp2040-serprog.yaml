name: Build XIAO RP2040 Serprog

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-arm-none-eabi cmake ninja-build

      - name: Clone Pico SDK
        run: |
          git clone --depth 1 https://github.com/raspberrypi/pico-sdk
          cd pico-sdk && git submodule update --init --recursive lib/tinyusb

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake \
            -G Ninja \
            -DPICO_SDK_PATH=$PWD/../pico-sdk \
            -DPICO_STDIO_USB=ON \
            ../projects/reference-projects/XIAO_RP2040_Serprog

      - name: Build
        run: ninja
        working-directory: build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pico_serprog
          path: |
            build/pico_serprog.elf
            build/pico_serprog.uf2
